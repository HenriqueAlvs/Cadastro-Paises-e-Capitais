<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Países e Capitais</title>
</head>
<body>
    <h1>Cadastro de Países e Capitais</h1>

    <form id="formPaises">
        <input type="text" id="nome">
        <input type="text" id="capital">
        <button id="btnSalvar" type="submit">Cadastrar</button>
    </form>

    <table>
        <thead>
            <th>Posição</th>
            <th>Países</th>
            <th>Capitais</th>
        </thead>

        <tbody id="corpoTabela"></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
